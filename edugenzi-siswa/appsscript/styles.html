<style>
  :root { color-scheme: light; font-family: Arial, sans-serif; color: #17202a; background: #f3f6fa; }
  * { box-sizing: border-box; }
  body { margin: 0; }
  .container { width: min(1100px, calc(100% - 32px)); margin: 32px auto; }
  .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 24px; margin: 18px 0; box-shadow: 0 3px 12px #17202a0a; }
  .login-card { max-width: 420px; margin: 10vh auto; }
  h1, h2, p { margin-top: 0; }
  h1 { font-size: 26px; } h2 { font-size: 19px; margin-bottom: 18px; }
  .muted { color: #64748b; font-size: 14px; }
  label { display: grid; gap: 7px; font-size: 14px; font-weight: 600; }
  input, select { width: 100%; padding: 11px 12px; border: 1px solid #cbd5e1; border-radius: 7px; background: white; font: inherit; }
  input:focus, select:focus { outline: 2px solid #93c5fd; border-color: #2563eb; }
  form { display: grid; gap: 15px; }
  .form-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .form-action { display: flex; align-items: end; }
  button { min-height: 42px; padding: 10px 16px; border: 0; border-radius: 7px; color: white; background: #155eef; font: inherit; font-weight: 700; cursor: pointer; }
  button:hover { background: #104bc2; } button:disabled { opacity: .6; cursor: wait; }
  button.secondary { color: #17202a; background: #e2e8f0; }
  .topbar, .list-header { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
  .topbar h1, .topbar p { margin-bottom: 5px; }
  .list-header input { max-width: 320px; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 12px 10px; border-bottom: 1px solid #e2e8f0; vertical-align: top; }
  th { color: #475569; background: #f8fafc; }
  a { color: #155eef; font-weight: 600; }
  .message { min-height: 20px; margin: 12px 0 0; color: #166534; font-size: 14px; }
  .message.error { color: #b42318; }
  @media (max-width: 650px) { .container { width: min(100% - 20px, 1100px); margin: 12px auto; } .card { padding: 17px; } .form-grid { grid-template-columns: 1fr; } .topbar, .list-header { align-items: stretch; flex-direction: column; } .list-header input { max-width: none; } }
</style>
